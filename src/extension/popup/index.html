<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <base target="_blank">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
  <link rel="stylesheet" type="text/css" href="./common.css">
  <link rel="stylesheet" type="text/css" href="./popup.css">
  <title>Popup</title>
</head>
<body style="min-width: 100px">
  <div id="app">
    <div id="status">
    </div>
    <div id="buttons">
      <button id="btn-rewind">
        <i class="material-icons button-1">&#xe020;</i>
      </button>
      <img src="img/loading.gif" alt="" id="imgLoading"/>
      <button id="btn-play">
        <i class="material-icons button-1">&#xe037;</i>
      </button>
      <button id="btn-pause">
        <i class="material-icons button-1">pause</i>
      </button>
      <button id="btn-stop">
        <i class="material-icons button-1">stop</i>
      </button>
      <button id="btn-settings">
        <i class="material-icons button-1">settings</i>
      </button>
      <button id="btn-forward">
        <i class="material-icons button-1">&#xe01f;</i>
      </button>
    </div>
    <div id="highlight">
    </div>
    <div id="toolbar">
      <div class="btn-group">
        <button id="decrease-font-size" type="button" class="btn btn-sm btn-light">
          A-
        </button>
        <button id="increase-font-size" type="button" class="btn btn-sm btn-light">
          A+
        </button>
      </div>
      <div class="btn-group window-size">
        <button id="decrease-window-size" type="button" class="btn btn-sm btn-light">
          <i class="material-icons">remove</i>
        </button>
        <button id="increase-window-size" type="button" class="btn btn-sm btn-light">
          <i class="material-icons">add</i>
        </button>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
