<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base target="_blank">
  <link rel="stylesheet" type="text/css" href="../assets/common.css">
  <link rel="stylesheet" type="text/css" href="./options.css">
  <title>Options</title>
</head>
<body>
  <div id="app">
    <form class="form">
      <div id="status" hidden></div>
      <fieldset>
        <h4 id="engine-name">Engine</h4>
        <div class="field">
          <label for="server-url">Server URL</label>
          <input type="url" id="server-url" class="input" name="server_url"/>
          <button id="server-test" class="btn">Test</button>
        </div>
        <div class="field">
          <label for="preferred-voice">Preferred voice</label>
          <select id="preferred-voice" name="preferred_voice" class="select"></select>
        </div>
        <div class="field">
          <label for="rate">Reading rate</label>
          <input type="range" id="rate" name="rate" min="0.1" max="3.0" step="0.1"/>
          <span id="rate-value">&times;0.0</span>
        </div>
      </fieldset>
      <fieldset>
        <input type="submit" id="save" class="btn" value="Save">
      </fieldset>
    </form>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
