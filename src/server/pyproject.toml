[project]
name = "read-out-server"
version = "0.1.5"
requires-python = ">=3.10,<3.13"
dependencies = [
  "flask>=3.1",
  "flask-cors>=5.0",
  "torch>=2.0,<2.4",
  "soundfile>=0.13",
  "phonemizer>=3.3",
  "nltk>=3.9",
  "num2words>=0.5",
  "inflect>=7.3",
  "munch>=4.0",
  "librosa>=0.10",
  "numpy>=2.1",
  "transformers>=4.40,<5.0",
  "kokoro>=0.9.2",
  "gunicorn>=23.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "engines"]
